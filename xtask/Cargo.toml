[package]
name        = "xtask"
version     = "0.0.0"
edition     = "2024"
publish     = false
description = "Repository automation for s2-kit: vendoring specifications, generating documentation and rendering the rule catalogue"

[dependencies]
anyhow     = "1"
serde      = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml       = "0.9"
s2-kit     = { path = "..", features = ["std", "uuid"] }
